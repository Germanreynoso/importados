# Deploy de la landing (el proyecto vive en una subcarpeta del repo)
[build]
  base = "tech-store-landing-page"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Runtime oficial de Next.js en Netlify: habilita SSR, ISR, API routes y middleware.
# Netlify lo instala automáticamente, se declara para fijar la versión.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache largo para las fotos de producto (nombres estables, contenido inmutable)
[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
